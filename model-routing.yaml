version: 1

# Powderline reads this file as workflow configuration. These values are passed
# to sessions_spawn at runtime; the agents.list[] model remains the fallback.
modelRouting:
  enabled: true
  scoutEnabled: true
  scout: openai/gpt-6-luna
  standard: openai/gpt-6.1-terra
  frontier: openai/gpt-6.1-sol
  fallback: existing
  scoutMaxBytes: 8192
